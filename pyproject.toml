[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfirm"
version = "0.1.0"
description = "Multi-agent crypto day-trading research firm: Planner → Worker → Judge with a human-owned capital gate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "ccxt>=4.3",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "loguru>=0.7",
  "python-dotenv>=1.0",
  "truststore>=0.9",
]

[project.optional-dependencies]
# Regime HMM and numba backtester. Kept optional: both lag new Python releases.
research = [
  "hmmlearn>=0.3",
  "numba>=0.59",
  "vectorbt>=0.26",
  "matplotlib>=3.8",
]
# Scheduler for ops/. cron is the fallback and needs nothing.
ops = [
  "prefect>=2.16",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = [
  "data*", "research*", "signals*", "regime*", "portfolio*",
  "risk*", "execution*", "news*", "eval*", "ops*", "trader*",
]
exclude = ["tests*", "docs*", "configs*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = [
  "S101",  # asserts are how we enforce invariants in tests and gates
  "N806",  # X, M, T for matrices is standard quant notation
  "N818",  # LiveTradingBlocked / RiskViolation read better than *Error
  "E501",  # ruff format owns line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "risk: tests proving a risk limit triggers",
  "execution: tests for broker adapters and the LIVE gate",
  "slow: anything that hits the network or takes > 10s",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict_optional = true
