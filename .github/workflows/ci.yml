name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Secret scan (cheap, in addition to any org-level scanner)
        run: |
          ! git grep -nE '(api[_-]?key|secret|token)\s*[:=]\s*["'"'"'][A-Za-z0-9/+=_-]{20,}' -- ':!*.example' ':!.github/**' \
            || (echo "Possible secret committed. Secrets live in .env only." && exit 1)
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: Gate self-test
        run: python -m eval.gate --self-test

  promotion-gate:
    # Runs eval.gate for every strategy touched in this change. A strategy that has no
    # tearsheet yet fails the gate — that is intended: research/strategies is for things
    # that have been backtested under the protocol.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Find touched strategies
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          files=$(git diff --name-only "$base" "$head" -- 'research/strategies/*.py' 'research/reports/*.json' | grep -v '__init__' || true)
          names=$(echo "$files" | sed -E 's#research/(strategies|reports)/##; s#_[0-9a-f]{12}\.json$##; s#\.py$##' | sort -u | tr '\n' ' ')
          echo "strategies=$names" >> "$GITHUB_OUTPUT"
          echo "touched: $names"
      - name: Run eval.gate on touched strategies
        if: steps.changed.outputs.strategies != ''
        run: |
          rc=0
          for s in ${{ steps.changed.outputs.strategies }}; do
            echo "::group::eval.gate $s"
            python -m eval.gate "$s" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  risk-and-execution-guard:
    # Any change under risk/ or execution/ must come with a test change. Rule:
    # risk-invariants.mdc "Any code touching risk/ or execution/ needs a test that proves
    # the limit triggers."
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tests alongside risk/execution changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          if echo "$changed" | grep -qE '^(risk|execution)/.*\.py$'; then
            if ! echo "$changed" | grep -qE '^tests/test_(risk|execution|kill_switch|broker).*\.py$'; then
              echo "risk/ or execution/ changed without a corresponding test change."
              exit 1
            fi
          fi
          if echo "$changed" | grep -q '^capital_allocation.yaml$'; then
            echo "::warning::capital_allocation.yaml changed. Only the CIO may edit this file."
          fi
